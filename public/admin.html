<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yönetici</title>
<style>
:root{--bg:#f4f4f4;--card:#fff;--ink:#111;--mut:#6b6b6b;--line:#e0e0e0;--soft:#ededed;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f0f;--card:#181818;--ink:#f2f2f2;--mut:#9a9a9a;--line:#2c2c2c;--soft:#222;--on:#111}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.w{max-width:1020px;margin:0 auto;padding:16px}
button,input{font:inherit;color:inherit;border-radius:8px;border:1px solid var(--line);padding:8px 11px;background:var(--card)}
input{width:100%}
button{background:var(--ink);color:var(--on);border:0;cursor:pointer;font-weight:600}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.k{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.kart{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.st{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.st .kart{flex:1 1 140px}
.st b{font-size:26px;display:block}.st span{color:var(--mut);font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:14px}
th{background:var(--soft);color:var(--mut)}
.e{font-weight:700}.h{color:var(--mut);font-weight:700;text-decoration:underline dotted}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top .sp{margin-left:auto;color:var(--mut);font-size:13px}
.m{background:var(--soft);padding:10px;border-radius:8px;margin:10px 0}
</style>
</head>
<body>
<div class="w" id="k">Yükleniyor...</div>
<script>
// Kütüphane gerektirmez; Supabase'e doğrudan bağlanır. Anahtar ilk açılışta sorulur ve bu tarayıcıda saklanır.
const SUPABASE_URL = "https://rnlretxgwextrvavpxko.supabase.co";
const K = document.getElementById("k");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DEPO = { al: a => { try { return localStorage.getItem(a); } catch { return null; } }, yaz: (a, v) => { try { localStorage.setItem(a, v); } catch {} }, sil: a => { try { localStorage.removeItem(a); } catch {} } };
let liste = [], q = "", KEY = DEPO.al("adm_key") || "", TOK = null;

// Giriş sonrası adresin #access_token kısmını al
(function () {
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  if (h.get("access_token")) {
    DEPO.yaz("adm_tok", JSON.stringify({ t: h.get("access_token"), exp: Date.now() + (+h.get("expires_in") || 3600) * 1000 }));
    history.replaceState(null, "", location.pathname);
  } else if (h.get("error_description")) {
    window.GIRIS_HATASI = h.get("error_description");
    history.replaceState(null, "", location.pathname);
  }
  try { const o = JSON.parse(DEPO.al("adm_tok") || "null"); if (o && o.exp > Date.now()) TOK = o.t; } catch {}
})();

const mailOku = () => { try { return JSON.parse(atob(TOK.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).email || ""; } catch { return ""; } };

async function rpc(ad, govde) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${ad}`, {
    method: "POST",
    headers: { apikey: KEY, Authorization: `Bearer ${TOK}`, "content-type": "application/json" },
    body: JSON.stringify(govde || {}),
  });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && (j.message || j.msg)) || "HTTP " + r.status);
  return j;
}

function anahtarEkrani() {
  K.innerHTML = `<div class="kart" style="max-width:520px;margin:50px auto"><h2 style="margin:0 0 8px">Bir kerelik kurulum</h2>
  <p>Supabase &gt; Project Settings &gt; API Keys sayfasındaki <b>Publishable key</b> değerini yapıştırın (<code>sb_publishable_...</code> ile başlar). Secret key'i değil.</p>
  <input id="a" placeholder="sb_publishable_..."><div style="height:8px"></div><button id="s">Kaydet</button></div>`;
  document.getElementById("s").onclick = () => {
    const v = document.getElementById("a").value.trim();
    if (!/^(sb_publishable_|eyJ)/.test(v)) return alert("Bu bir publishable anahtara benzemiyor.");
    DEPO.yaz("adm_key", v); location.reload();
  };
}

function girisEkrani(hata) {
  K.innerHTML = `<div class="kart" style="max-width:360px;margin:60px auto"><h2 style="margin:0 0 12px">Yönetici girişi</h2>
  ${hata ? `<div class="m">${esc(hata)}</div>` : ""}
  <button id="g" style="width:100%;padding:12px">Google ile devam et</button>
  <p style="font-size:12px;color:var(--mut);margin:12px 0 0"><a href="#" id="d">Anahtarı değiştir</a></p></div>`;
  document.getElementById("g").onclick = () => {
    location.href = `${SUPABASE_URL}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(location.origin + "/admin.html")}`;
  };
  document.getElementById("d").onclick = e => { e.preventDefault(); DEPO.sil("adm_key"); location.reload(); };
}

function cikis() { DEPO.sil("adm_tok"); location.reload(); }

async function basla() {
  try {
    if (!KEY) return anahtarEkrani();
    if (!TOK) return girisEkrani(window.GIRIS_HATASI && "Giriş hatası: " + window.GIRIS_HATASI);
    liste = await rpc("admin_liste");
    if (!liste.length) {
      K.innerHTML = `<div class="m">Henüz kayıtlı okul yok, ya da bu hesabın yönetici yetkisi yok (${esc(mailOku())}).</div><button class="g" id="c">Çıkış</button>`;
      document.getElementById("c").onclick = cikis;
      return;
    }
    ciz(mailOku());
  } catch (e) {
    const yetki = /JWT|expired|invalid|401/i.test(e.message);
    if (yetki) { DEPO.sil("adm_tok"); TOK = null; return girisEkrani("Oturum süresi doldu, tekrar girin."); }
    K.innerHTML = `<div class="m"><b>Hata:</b> ${esc(e.message)}<br><small>Supabase'de <code>guncelle.sql</code> dosyasını çalıştırdığınızdan ve anahtarın doğru olduğundan emin olun.</small></div>
    <button class="g" id="c">Çıkış</button> <button class="g" id="d">Anahtarı değiştir</button>`;
    document.getElementById("c").onclick = cikis;
    document.getElementById("d").onclick = () => { DEPO.sil("adm_key"); location.reload(); };
  }
}

function ciz(mail) {
  const bg = new Date().toISOString().slice(0, 10), h7 = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
  const g = liste.filter(k => (k.ad + " " + k.email).toLowerCase().includes(q.toLowerCase()));
  const akt = liste.filter(k => k.aktif && k.abonelik_bitis >= bg);
  K.innerHTML = `<div class="top"><h2 style="margin:0">Yönetici paneli</h2><span class="sp">${esc(mail)}</span><button class="g" id="c">Çıkış</button></div>
  <div class="st"><div class="kart"><b>${liste.length}</b><span>kayıtlı okul</span></div>
  <div class="kart"><b>${akt.length}</b><span>aboneliği süren</span></div>
  <div class="kart"><b>${akt.filter(k => k.abonelik_bitis <= h7).length}</b><span>7 gün içinde bitecek</span></div>
  <div class="kart"><b>${liste.reduce((t, k) => t + Number(k.ogrenci), 0)}</b><span>toplam öğrenci</span></div>
  <div class="kart"><b>${liste.reduce((t, k) => t + Number(k.bu_ay_mesaj), 0)}</b><span>bu ay giden mesaj</span></div></div>
  <input id="q" placeholder="Okul veya e-posta ara" value="${esc(q)}" style="margin-bottom:8px;width:280px;max-width:100%">
  <div class="tw"><table><thead><tr><th>Okul</th><th>E-posta</th><th>Öğrenci</th><th>Bu ay mesaj</th><th>Abonelik bitiş</th><th>IBAN</th><th>Durum</th><th></th></tr></thead><tbody>
  ${g.map(k => { const b = k.abonelik_bitis < bg; return `<tr><td>${esc(k.ad)}</td><td>${esc(k.email)}</td><td>${k.ogrenci}</td><td>${k.bu_ay_mesaj}</td>
  <td>${k.abonelik_bitis}</td>
  <td class="${k.iban_var ? "e" : "h"}">${k.iban_var ? "Girildi" : "Eksik"}</td>
  <td class="${!k.aktif || b ? "h" : "e"}">${!k.aktif ? "Durduruldu" : b ? "Süresi doldu" : "Aktif"}</td>
  <td><button class="g" data-u="${k.id}" data-n="30">+30 gün</button> <button class="g" data-u="${k.id}" data-n="365">+1 yıl</button> <button class="k" data-a="${k.id}">${k.aktif ? "Durdur" : "Aç"}</button></td></tr>`; }).join("")}
  </tbody></table></div>`;
  document.getElementById("c").onclick = cikis;
  document.getElementById("q").oninput = e => { q = e.target.value; const p = e.target.selectionStart; ciz(mail); const i = document.getElementById("q"); i.focus(); i.setSelectionRange(p, p); };
  K.querySelectorAll("[data-u]").forEach(b => b.onclick = async () => { await rpc("admin_uzat", { p_id: b.dataset.u, p_gun: +b.dataset.n }); basla(); });
  K.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => { const k = liste.find(x => x.id == b.dataset.a); await rpc("admin_durum", { p_id: k.id, p_aktif: !k.aktif }); basla(); });
}
basla();
</script>
</body>
</html>
